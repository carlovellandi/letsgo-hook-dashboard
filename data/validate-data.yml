name: Validate hook-study data
on:
  push:
    paths:
      - "data/variants_log.csv"
      - "scripts/validate_data.py"
  pull_request:
    paths:
      - "data/variants_log.csv"
      - "scripts/validate_data.py"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_data.py data/variants_log.csv
